name: Validate translations

# DATA-ONLY check. This file runs from the main branch (pull_request_target) and never runs code from the pull request:
# the pull request is fetched as a git ref and its catalogs are read with `git show` as plain data, then checked by the
# validator that is on main. Without secrets, with a read-only token. The result is indicative: the maintainer imports every
# contribution through a stricter private pipeline and reviews the meaning before anything ships.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validator tests (code from main)
        run: node --test scripts/validate-i18n.test.mjs

      - name: Fetch the pull request as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - name: Only translation catalogs may change
        run: |
          base=$(git merge-base HEAD refs/remotes/pr/head)
          git diff --name-status "$base" refs/remotes/pr/head > "$RUNNER_TEMP/changes.txt"
          cat "$RUNNER_TEMP/changes.txt"
          [ -s "$RUNNER_TEMP/changes.txt" ] || { echo "::error::No changes."; exit 1; }
          bad=0
          while IFS=$'\t' read -r status path rest; do
            if [ -n "$rest" ] || { [ "$status" != "A" ] && [ "$status" != "M" ]; }; then echo "::error::Not allowed (only added or modified files): $status $path"; bad=1; continue; fi
            if ! printf '%s' "$path" | grep -Eq '^i18n/[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*\.json$' || [ "$path" = "i18n/pt-BR.json" ]; then
              echo "::error::Pull requests here may only add or change i18n/<language>.json (never pt-BR.json, scripts, workflows or other files): $path"; bad=1; continue
            fi
            size=$(git cat-file -s "refs/remotes/pr/head:$path")
            if [ "$size" -gt 5000000 ]; then echo "::error::File too large: $path"; bad=1; fi
          done < "$RUNNER_TEMP/changes.txt"
          exit $bad

      - name: Validate the catalogs (validator and source from main, PR files as data)
        run: |
          work="$RUNNER_TEMP/check"
          mkdir -p "$work"
          cp -r scripts i18n "$work/"
          files=()
          while IFS=$'\t' read -r status path; do
            git show "refs/remotes/pr/head:$path" > "$work/$path"
            files+=("$path")
          done < "$RUNNER_TEMP/changes.txt"
          cd "$work"
          node scripts/validate-i18n.mjs "${files[@]}"
