# Label scheme for this repository.
# Documentation only: the owner applies it later (for example with a label-sync tool or `gh label create`).
# Colors are 6-digit hex without '#'. Descriptions are under 100 characters.

# Type
- name: bug
  color: d73a4a
  description: Something does not work as expected
- name: enhancement
  color: a2eeef
  description: New feature or improvement
- name: translation
  color: 0e8a16
  description: Wrong, unclear or missing text in a language
- name: documentation
  color: 0075ca
  description: README, guides or other documentation
- name: question
  color: d876e3
  description: A question about using AionCore
- name: accessibility
  color: 5319e7
  description: Readability, contrast, keyboard or screen reader use

# State
- name: needs-triage
  color: fbca04
  description: New issue, not reviewed yet
- name: needs-info
  color: fef2c0
  description: Waiting for more details from the reporter
- name: confirmed
  color: e99695
  description: Reproduced or accepted
- name: in-progress
  color: f9d0c4
  description: Someone is working on it
- name: fixed-in-next-release
  color: c2e0c6
  description: Fixed and shipping in the next version
- name: wontfix
  color: ffffff
  description: Will not be worked on
- name: duplicate
  color: cfd3d7
  description: Already reported in another issue
- name: invalid
  color: e4e669
  description: Not a valid report

